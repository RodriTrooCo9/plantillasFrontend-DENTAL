services:
  postgres:
    image: postgres:16-alpine
    container_name: lumina_dental_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: lumina_dental
      TZ: America/Mexico_City
    ports:
      - "5433:5432"
    volumes:
      - lumina_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lumina_dental"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: lumina_dental_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - lumina_ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
    # NOTA: En el equipo de producción con GPU se ejecuta:
    # docker compose exec ollama ollama pull qwen2.5:7b-instruct

volumes:
  lumina_pgdata:
  lumina_ollama_data:

